<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Satelliten</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="48x48" href="pictures/favicon.png">

    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Haupt-Content -->
  <div class="main-content" style="margin-left: 0; width: 100%; flex-direction: column; position: relative;">
    <a href="index.html" style="position: absolute; top: 10px; left: 130px; z-index: 999; color: white; text-decoration: none; font-size: 18px;">⬅ Home</a>
    <div id="debug-info" style="position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.7); color: white; padding: 10px; font-size: 12px; border-radius: 5px; font-family: monospace;"></div>
    <div id="cesiumContainer" style="width: 100%; height: 100%; flex: 1;"></div>
  </div>

  <!-- JavaScript -->
<!-- satellite.js - mit mehreren CDN-Optionen -->
<script src="https://cdn.jsdelivr.net/npm/satellite.js@4.0.0/dist/satellite.min.js"></script>
<!-- Fallback -->
<script src="https://unpkg.com/satellite.js/dist/satellite.min.js"></script>
<script src="satelliten.js"></script>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  .main-content {
    width: 100% !important;
    height: 100vh !important;
  }
</style>

<script>
  // Überprüfe ob Scripts geladen sind
  window.addEventListener('load', function() {
    console.log("Page loaded");
    console.log("Cesium:", typeof Cesium);
    console.log("satellite:", typeof satellite);
  });
  
  // Überprüfe regelmäßig
  setTimeout(() => {
    console.log("Nach 2s - satellite:", typeof satellite);
  }, 2000);
  
  // Error Handler
  window.addEventListener('error', function(e) {
    console.error("Error:", e.message);
  });
</script>
</body>
</html>
