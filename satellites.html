<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Satelliten</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="48x48" href="pictures/favicon.png">

  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="main-content" style="margin-left: 0; width: 100%; flex-direction: column; position: relative;">
    <a href="index.html" class="home-link">⬅ Home</a>
    <div id="debug-info"></div>
    <div id="cesiumContainer" style="width: 100%; height: 100%; flex: 1;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/satellite.js@4.0.0/dist/satellite.min.js"></script>
  <script src="https://unpkg.com/satellite.js/dist/satellite.min.js"></script>
  <script src="satelliten.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .main-content {
      width: 100% !important;
      height: 100vh !important;
    }
    .home-link {
      position: absolute;
      top: 10px;
      left: 200px;
      z-index: 999;
      color: white;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.7);
      border-radius: 6px;
      transition: all 0.3s ease;
    }
    .home-link:hover {
      background: rgba(0,120,215,0.9);
    }
    #debug-info {
      position: absolute;
      top: 50px;
      left: 10px;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 5px;
      font-family: monospace;
      max-width: 200px;
      word-wrap: break-word;
    }
    /* Responsive Anpassungen */
    @media (max-width: 768px) {
      .home-link {
        font-size: 12px;
        padding: 6px 10px;
      }
      #debug-info {
        font-size: 10px;
        padding: 6px 8px;
        max-width: 150px;
      }
    }
  </style>

  <script>
    window.addEventListener('load', function() {
      console.log("Page loaded");
      console.log("Cesium:", typeof Cesium);
      console.log("satellite:", typeof satellite);
    });

    setTimeout(() => {
      console.log("Nach 2s - satellite:", typeof satellite);
    }, 2000);

    window.addEventListener('error', function(e) {
      console.error("Error:", e.message);
    });
  </script>
</body>
</html>
